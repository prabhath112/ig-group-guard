version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/android-sdk']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: site
