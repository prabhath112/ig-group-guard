name: Site

# Deploys site/ (landing page with APK download, privacy policy, terms) to Vercel production.
# Runs on main when the site or docs change, and after every release (called by release.yml),
# so the page always shows the newest version.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/**', 'assets/logo.svg', 'vercel.json', '.github/workflows/site.yml']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-24.04
    environment:
      name: vercel-production
      url: https://ig-group-guard.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npx --yes vercel@65.11.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.11.0 build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.11.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Smoke test
        run: |
          set -euo pipefail
          for p in / /privacy-policy /terms; do
            curl -fsS -o /dev/null -w "%{http_code} $p\n" "https://ig-group-guard.vercel.app$p"
          done
