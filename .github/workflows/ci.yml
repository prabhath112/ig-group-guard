name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck build.sh
      - name: Python syntax
        run: python3 -m py_compile test/e2e.py assets/render.py
      - name: Workflow lint (actionlint)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Workflow security audit (zizmor, strictest persona)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run zizmor==1.32.0 --persona=auditor --format=github .github

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scan every commit, not only the tip
      - name: gitleaks 8.30.1 (checksum verified)
        run: |
          set -euo pipefail
          v=8.30.1; base="https://github.com/gitleaks/gitleaks/releases/download/v$v"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --no-banner --redact --exit-code 1

  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sdk
        uses: ./.github/actions/android-sdk
      - name: Build (debug APKs only, no secrets on PRs)
        run: bash build.sh
        env:
          BUNDLETOOL: ${{ steps.sdk.outputs.bundletool }}
      - name: Manifest checks
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$aapt2" dump badging build/ig-group-guard-debug.apk > badging.txt
          grep -q "package: name='io.github.prabhath112.iggroupguard'" badging.txt
          grep -q "targetSdkVersion:'36'" badging.txt
          if grep -q "android.permission.INTERNET" badging.txt; then
            echo "::error::INTERNET permission found; privacy policy says the app has none"; exit 1
          fi
          "$aapt2" dump xmltree --file res/xml/service_config.xml build/ig-group-guard-debug.apk \
            | grep -q "isAccessibilityTool.*=false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: build/*.apk
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks
          path: build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: PATH="$ANDROID_HOME/platform-tools:$PATH" python3 -I test/e2e.py -s emulator-5554

  site:
    name: Site build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --prefix site --ignore-scripts
      - name: Vulnerability scan (fails on any advisory)
        run: npm audit --prefix site --audit-level=low
      - name: Package integrity/provenance scan
        run: npm audit signatures --prefix site
      - run: node site/build.mjs
      - name: Check the built site
        run: |
          set -euo pipefail
          for f in index.html privacy-policy.html terms.html logo.svg; do test -s "site/dist/$f"; done
          v=$(grep -o 'android:versionName="[^"]*"' app/AndroidManifest.xml | cut -d'"' -f2)
          grep -q "Version <a href=\"https://github.com/prabhath112/ig-group-guard/releases/tag/v$v\">$v</a>" site/dist/index.html
          grep -q 'releases/latest/download/ig-group-guard-release.apk' site/dist/index.html
          grep -q 'prabhath.kumar2000@gmail.com' site/dist/privacy-policy.html
          if grep -l '<script' site/dist/*.html; then echo "::error::script tag found; CSP allows none"; exit 1; fi
